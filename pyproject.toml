[project]
name = "sre-incident-commander"
version = "0.1.0"
description = "Local SRE incident analysis and observability portfolio project"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
