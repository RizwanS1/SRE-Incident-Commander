groups:
  - name: service-sli-slo
    interval: 30s
    rules:
      - record: service:requests:rate5m
        expr: sum by (service) (rate(app_requests_total[5m]))
      - record: service:availability:ratio_rate5m
        expr: |
          1 - (
            sum by (service) (rate(app_requests_total{status_code=~"5.."}[5m]))
            /
            sum by (service) (rate(app_requests_total[5m]))
          )
      - record: service:error_ratio:rate5m
        expr: |
          sum by (service) (rate(app_requests_total{status_code=~"5.."}[5m]))
          /
          sum by (service) (rate(app_requests_total[5m]))
      - record: service:error_ratio:rate30m
        expr: |
          sum by (service) (rate(app_requests_total{status_code=~"5.."}[30m]))
          /
          sum by (service) (rate(app_requests_total[30m]))
      - record: service:error_ratio:rate1h
        expr: |
          sum by (service) (rate(app_requests_total{status_code=~"5.."}[1h]))
          /
          sum by (service) (rate(app_requests_total[1h]))
      - record: service:error_ratio:rate6h
        expr: |
          sum by (service) (rate(app_requests_total{status_code=~"5.."}[6h]))
          /
          sum by (service) (rate(app_requests_total[6h]))
      - record: service:latency:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(app_request_duration_seconds_bucket[5m]))
          )
      - record: service:slo:availability_target
        expr: service:requests:rate5m * 0 + 0.995
        labels:
          slo: availability
      - alert: SLOAvailabilityBelowTarget
        expr: service:availability:ratio_rate5m < 0.995
        for: 5m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "{{ $labels.service }} availability is below its 99.5% SLO"
          description: "Five-minute availability is {{ $value | humanizePercentage }}."
      - alert: ErrorBudgetBurnFast
        expr: |
          (service:error_ratio:rate5m / 0.005 > 14.4)
          and on (service) (service:error_ratio:rate1h / 0.005 > 14.4)
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "{{ $labels.service }} is burning its error budget rapidly"
          description: "The 99.5% SLO burn rate exceeded 14.4x over both 5m and 1h."
      - alert: ErrorBudgetBurnSlow
        expr: |
          (service:error_ratio:rate30m / 0.005 > 6)
          and on (service) (service:error_ratio:rate6h / 0.005 > 6)
        for: 5m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "{{ $labels.service }} is steadily burning its error budget"
          description: "The 99.5% SLO burn rate exceeded 6x over both 30m and 6h."
      - alert: ServiceP95LatencyHigh
        expr: service:latency:p95_5m > 0.5
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "{{ $labels.service }} p95 latency exceeds 500ms"
          description: "Measured p95 latency is {{ $value }} seconds."
