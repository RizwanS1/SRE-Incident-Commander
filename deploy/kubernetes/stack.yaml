apiVersion: v1
kind: Namespace
metadata:
  name: sre
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-commander
  namespace: sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-commander-read
  namespace: sre
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-commander-read
  namespace: sre
subjects:
  - kind: ServiceAccount
    name: incident-commander
    namespace: sre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-commander-read
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: sre
  labels: {app: orders}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders, service: orders}
    spec:
      containers:
        - name: orders
          image: sre-orders:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: PAYMENTS_URL
              value: http://payments:8000
            - name: INVENTORY_URL
              value: http://inventory:8000
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: sre
spec:
  selector: {app: orders}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: sre
  labels: {app: payments}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments, service: payments}
    spec:
      containers:
        - name: payments
          image: sre-payments:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: sre
spec:
  selector: {app: payments}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: sre
  labels: {app: inventory}
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory, service: inventory}
    spec:
      containers:
        - name: inventory
          image: sre-inventory:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: sre
spec:
  selector: {app: inventory}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.120.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 8889}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib, readOnly: true}
      volumes:
        - name: config
          configMap: {name: sre-otel-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: sre
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prometheus, port: 8889, targetPort: prometheus}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
          ports:
            - {name: query, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: sre
spec:
  selector: {app: jaeger}
  ports:
    - {name: query, port: 16686, targetPort: query}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports: [{name: http, containerPort: 9090}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
      volumes:
        - name: config
          configMap: {name: sre-prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sre
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports: [{name: http, containerPort: 9093}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
      volumes:
        - name: config
          configMap: {name: sre-alertmanager-config}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: sre
spec:
  selector: {app: alertmanager}
  ports: [{name: http, port: 9093, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: sre-local-only}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports: [{name: http, containerPort: 3000}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml, readOnly: true}
            - {name: config, mountPath: /var/lib/grafana/dashboards/sre-dashboard.json, subPath: dashboard.json, readOnly: true}
      volumes:
        - name: config
          configMap: {name: sre-grafana-config}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sre
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-commander
  namespace: sre
spec:
  replicas: 1
  selector:
    matchLabels: {app: incident-commander}
  template:
    metadata:
      labels: {app: incident-commander}
    spec:
      serviceAccountName: incident-commander
      containers:
        - name: incident-commander
          image: sre-incident-commander:local
          imagePullPolicy: IfNotPresent
          env:
            - {name: PROMETHEUS_URL, value: http://prometheus:9090}
            - {name: JAEGER_URL, value: http://jaeger:16686}
            - {name: LLM_PROVIDER, value: mock}
            - {name: POSTMORTEM_DIR, value: /var/lib/incident-commander/postmortems}
            - {name: INCIDENT_REPORT_DIR, value: /var/lib/incident-commander/incidents}
            - {name: AUDIT_LOG_PATH, value: /var/lib/incident-commander/audit.jsonl}
            - {name: AGENT_LOG_PATH, value: /var/lib/incident-commander/agent-events.jsonl}
            - name: APPROVAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: incident-commander-approval
                  key: token
                  optional: true
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/incident-commander}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: incident-commander
  namespace: sre
spec:
  selector: {app: incident-commander}
  ports: [{name: http, port: 8000, targetPort: http}]
